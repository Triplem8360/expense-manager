name: expense-manager

services:
  postgres:
    image: postgres:18.6-alpine
    env_file:
      - ${APP_ENV_FILE:-.env.docker}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:8.8.1-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  migrate:
    build:
      context: .
      target: runtime
    env_file:
      - ${APP_ENV_FILE:-.env.docker}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  api:
    build:
      context: .
      target: runtime
    env_file:
      - ${APP_ENV_FILE:-.env.docker}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8000/api/v1/localization/status', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    networks:
      - backend

  locust:
    image: locustio/locust:2.46.3
    profiles:
      - loadtest
    environment:
      LOCUST_LOCUSTFILE: /mnt/locust/locustfile.py
      LOCUST_HOST: ${LOCUST_TARGET_HOST:-http://api:8000}
      LOCUST_WEB_HOST: 0.0.0.0
      LOCUST_WEB_PORT: 8089
      LOAD_TEST_EMAIL: ${LOAD_TEST_EMAIL:-}
      LOAD_TEST_PASSWORD: ${LOAD_TEST_PASSWORD:-LoadTestPassword123}
      LOAD_TEST_EXPENSE_ID: ${LOAD_TEST_EXPENSE_ID:-}
      LOAD_TEST_MAX_FAILURE_RATIO: ${LOAD_TEST_MAX_FAILURE_RATIO:-0.01}
      LOAD_TEST_MAX_AVG_RESPONSE_MS: ${LOAD_TEST_MAX_AVG_RESPONSE_MS:-500}
      LOAD_TEST_MAX_P95_RESPONSE_MS: ${LOAD_TEST_MAX_P95_RESPONSE_MS:-1000}
    ports:
      - "127.0.0.1:${LOCUST_WEB_PORT:-8089}:8089"
    volumes:
      - ./loadtest:/mnt/locust:ro
      - ./loadtest/reports:/reports
    depends_on:
      api:
        condition: service_healthy
    init: true
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
