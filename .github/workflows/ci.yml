name: Development CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: development-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Test and build application
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: postgresql+asyncpg://expense_ci:ci-password@localhost:5432/expense_ci
      DATABASE_ECHO: "false"
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      COOKIE_SECURE: "true"

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: expense_ci
          POSTGRES_USER: expense_ci
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_ci -d expense_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install development dependencies
        run: |
          uv python install 3.13
          uv sync --locked

      - name: Check lockfile and code quality
        run: |
          uv lock --check
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .

      - name: Validate Compose configuration
        run: >-
          APP_ENV_FILE=.env.docker.example
          docker compose --env-file .env.docker.example config --quiet

      - name: Validate migrations
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check

      - name: Run tests
        run: uv run --frozen pytest

      - name: Build application image
        run: docker build --pull --target runtime --tag expense-manager:ci .

      - name: Smoke-test application image
        run: |
          test "$(docker image inspect expense-manager:ci --format '{{.Config.User}}')" = "expense-api"
          docker run --rm --network none \
            --env DATABASE_URL="$DATABASE_URL" \
            --env REDIS_URL="$REDIS_URL" \
            --env JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --entrypoint python \
            expense-manager:ci \
            -c "from expense_api.main import app; assert app.title"
