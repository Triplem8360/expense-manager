[project]
name = "expense-manager"
version = "0.1.0"
description = "An educational expense management REST API built with FastAPI."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2,<2.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi>=0.115.12,<1.0.0",
    "pydantic>=2.11.3,<3.0.0",
    "pydantic-settings>=2.9.1,<3.0.0",
    "pwdlib[argon2]>=0.3.0,<1.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.52,<3.0.0",
    "uvicorn[standard]>=0.34.2,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_api"]

[dependency-groups]
dev = [
    "babel>=2.17.0,<3.0.0",
    "httpx2>=2.0,<3.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.13.0,<1.0.0",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
